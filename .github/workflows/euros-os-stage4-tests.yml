# Euros OS integration: offline regression and isolated Home Assistant API tests.
name: Euros OS - CI (regression and HA Core)

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit and MQTT simulation / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout tested branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify MQTT dependency installs
        run: |
          python -m pip install --disable-pip-version-check 'paho-mqtt>=1.6,<3'
          python -c "import paho.mqtt.client as mqtt; client = mqtt.Client(); assert callable(client.connect)"

      - name: Report Python version and validate HA 2026.11 baseline
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 14, 2) if sys.version_info.minor == 14 else True"

      - name: Check Python syntax
        run: python -m compileall -q custom_components/euros_os tests tests_ha scripts

      - name: Run all offline tests (strict – no skips)
        run: python scripts/run_unit_tests_strict.py

      - name: Validate integration release ZIP (no release created)
        run: python scripts/build_release_zip.py --output /tmp/euros_os.zip

  homeassistant-api:
    name: Real Home Assistant Core 2026.11 API / Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout integration code
        uses: actions/checkout@v5

      - name: Set up supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install real Home Assistant 2026.11 and MQTT client
        run: |
          python -m pip install --disable-pip-version-check "homeassistant==2026.11.0" "pytest-homeassistant==2026.11.0" "paho-mqtt>=1.6,<3"
          python -c "import sys, homeassistant.const as const; assert sys.version_info >= (3, 14, 2); assert const.__version__ == '2026.11.0', const.__version__"

      - name: Verify entity API against real Home Assistant
        run: python -m unittest discover -s tests_ha -p 'test_*.py' -v

      - name: Verify GEO/EMS entry registration with actual HA test fixture
        run: python -m pytest -q -p no:respx --strict-markers tests_ha/test_real_ha_registration.py
